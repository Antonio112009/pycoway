[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pycoway"
dynamic = ["version"]
description = "Typed asyncio client for Coway AIRMEGA devices through IoCare"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.14"
authors = [
    { name = "Antonio112009" },
]
maintainers = [
    { name = "Antonio112009" },
]
keywords = ["coway", "iocare", "iocare api", "coway api", "airmega"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Runtime deps are floors, not pins, and they track the current Home
# Assistant release: HA pins exact versions (core: aiohttp; the scrape
# integration: beautifulsoup4), so a floor above its pin would make pip
# refuse the install inside HA, while a floor at the pin keeps the newest
# release the default everywhere else. Bump them together with the HA
# release they follow. Latest-version compatibility is verified by CI,
# which installs the newest releases on every run.
#
# Home Assistant 2026.9: Python >=3.14.2, aiohttp==3.14.3,
# beautifulsoup4==4.13.3 (scrape).
dependencies = [
    "aiohttp>=3.14.3",
    "beautifulsoup4>=4.13.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.4",
    "mypy>=2.4.1",
]

[project.urls]
Homepage = "https://github.com/antonio112009/pycoway"
"Bug Reports" = "https://github.com/antonio112009/pycoway/issues"
Source = "https://github.com/antonio112009/pycoway/"
Upstream = "https://github.com/RobertD502/cowayaio"

[tool.setuptools.dynamic]
version = { attr = "pycoway.__version__.__version__" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pycoway*"]

[tool.setuptools.package-data]
pycoway = ["py.typed"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "TC",     # flake8-type-checking
]

[tool.mypy]
python_version = "3.14"
files = ["src/pycoway"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
